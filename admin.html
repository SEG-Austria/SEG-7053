<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SEG - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 800px; } /* Admin Panel breiter */
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" class="logo" style="max-width: 80px;">
        <h1>🛡️ SEG Admin Panel</h1>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Neuen User anlegen</h3>
            <button onclick="window.logout()" style="width: auto; background: #444; color: white;">Abmelden</button>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <input id="newUsername" placeholder="Username">
            <input id="newPassword" type="password" placeholder="Passwort">
            <select id="newRole">
                <option>Rekrut</option>
                <option>Gräber</option>
                <option>Elite</option>
                <option>Admin</option>
            </select>
        </div>
        <button onclick="window.createUser()">+ User erstellen</button>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #555;">

        <h3>Mitglieder verwalten</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Rolle</th>
                    <th>Status</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
        <p id="status" class="status"></p>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
