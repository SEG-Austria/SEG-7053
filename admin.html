<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SEG Admin Panel</title>
</head>
<body>

<h1>🛡️ SEG Admin Panel</h1>
<p id="status"></p>
<h2>➕ Neuen User erstellen</h2>

<input id="newUsername" placeholder="Username">
<input id="newPassword" type="password" placeholder="Passwort">

<select id="newRole">
  <option>Rekrut</option>
  <option>Gräber</option>
  <option>Elite</option>
  <option>Admin</option>
</select>
<button onclick="window.logout()" style="background-color: #555; color: white; padding: 10px; border: none; cursor: pointer;">
  🚪 Abmelden
</button>
<button onclick="window.createUser()">User erstellen</button>

<hr>

<table border="1">
  <thead>
    <tr>
      <th>Username</th>
      <th>Rolle</th>
      <th>Gesperrt</th>
      <th>Aktionen</th>
    </tr>
  </thead>
  <tbody id="userList"></tbody>
</table>
<div style="background: #222; padding: 10px; margin-bottom: 20px;">
    <a href="dashboard.html" style="color: #00d4ff; text-decoration: none; margin-right: 20px;">📋 Zur Mitgliederliste</a>
    <span style="color: #aaa;">| Angemeldet als Admin</span>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
