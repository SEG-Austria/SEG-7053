<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SEG Admin Panel</title>
</head>
<body>

<h1>🛡️ SEG Admin Panel</h1>
<p id="status"></p>
<h2>➕ Neuen User erstellen</h2>

<input id="newUsername" placeholder="Username">
<input id="newPassword" type="password" placeholder="Passwort">

<select id="newRole">
  <option>Rekrut</option>
  <option>Gräber</option>
  <option>Elite</option>
  <option>Admin</option>
</select>

<button onclick="createUser()">User erstellen</button>

<hr>

<table border="1">
  <thead>
    <tr>
      <th>Username</th>
      <th>Rolle</th>
      <th>Gesperrt</th>
      <th>Aktionen</th>
    </tr>
  </thead>
  <tbody id="userList"></tbody>
</table>

<script type="module" src="admin.js"></script>
</body>
</html>
