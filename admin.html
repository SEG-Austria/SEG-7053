<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SEG - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <div class="header">
        <img src="logo.png" class="logo" style="max-width: 80px;">
        <h1 class="text-gold">🛡️ Admin Panel</h1>
        <div style="margin-top: 15px;">
            <button onclick="window.location.href='dashboard.html'" style="width: auto; background: var(--panel-bg); color: white; padding: 8px 15px; border: 1px solid var(--border-color);">Zurück zum Dashboard</button>
            <button onclick="window.logout()" style="width: auto; background: #444; color: white; padding: 8px 15px; margin-left: 10px;">Abmelden</button>
        </div>
    </div>

    <div class="main-content" style="width: 100%; display: flex; flex-direction: column; align-items: center; padding: var(--spacing-lg) 0;">
        
        <div class="container" style="max-width: 900px;">
            <h3 class="text-gold">Neuen User anlegen</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
                <div>
                    <label class="text-muted" style="font-size: 0.8em;">USERNAME</label>
                    <input id="newUsername" placeholder="Vorname">
                </div>
                <div>
                    <label class="text-muted" style="font-size: 0.8em;">PASSWORT</label>
                    <input id="newPassword" type="password" placeholder="Passwort">
                </div>
                <div>
                    <label class="text-muted" style="font-size: 0.8em;">ROLLE</label>
                    <select id="newRole">
                        <option>Anfänger</option>
                        <option>Schlechter Arbeiter</option>
                        <option>Mittelmäßiger Arbeiter</option>
                        <option>Guter Arbeiter</option>
                        <option>Bester Arbeiter</option>
                        <option>General</option>
                        <option>Co-Anführer</option>
                        <option>Anführer</option>
                        <option>Admin</option>
                    </select>
                </div>
            </div>
            <button onclick="window.createUser()">+ USER ERSTELLEN</button>
        </div>

        <div class="container" style="max-width: 900px;">
            <h3 class="text-gold">Mitglieder verwalten</h3>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Rolle</th>
                        <th>Status</th>
                        <th>Account</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
            <p id="status" class="status"></p>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
