<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SEG - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <div class="header">
        <img src="logo.png" alt="SEG Logo" class="logo">
        <h1>SEG – Mitgliederbereich</h1>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<div class="container" id="faceContainer">
    <h3 style="color: var(--primary-gold);">🔐 Biometrischer Check-In</h3>
    <div style="position: relative;">
        <video id="video" width="100%" height="auto" autoplay playsinline muted style="border-radius: 8px;"></video>
        <canvas id="overlay" style="position: absolute; top: 0; left: 0;"></canvas>
    </div>
    <p id="faceStatus">Initialisiere KI...</p>
    <button id="regBtn" onclick="registerFace()" style="display:none;">Mein Gesicht speichern</button>
</div>
    </div>

    <div class="container" style="max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="welcomeMsg">Lade Profil...</h3>
            <button onclick="window.logout()" style="width: auto; background: #444; color: white; padding: 5px 15px;">Abmelden</button>
        </div>

        <p style="color: var(--primary-gold); font-size: 0.9em;">Hier findest du alle aktiven Mitglieder der Super Elite Gräber:</p>

        <table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Rang</th>
            <th>Anwesenheit</th>
        </tr>
    </thead>
    <tbody id="memberList"></tbody>
</table>
        <hr style="border: 0; border-top: 1px solid #333; margin: 40px 0;">

<div class="container" style="max-width: 600px; background: rgba(0,0,0,0.3); border: 1px solid #c5a05933;">
    <h3 style="color: var(--primary-gold); margin-top: 0; display: flex; align-items: center;">
        <span style="margin-right: 10px;">📜</span> Letzte Aktivitäten
    </h3>
    
    <div id="logList" class="log-container">
        <p style="color: #666; font-style: italic;">Lade Aktivitäten...</p>
    </div>
</div>

        <div id="adminLink" style="margin-top: 20px; text-align: center; display: none;">
            <a href="admin.html" style="color: var(--primary-gold); text-decoration: none; font-size: 0.8em; border: 1px solid var(--primary-gold); padding: 5px 10px; border-radius: 4px;">🛡️ Admin Panel</a>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
