<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SEG - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="SEG Logo" class="logo">
        <h1>SEG – Mitgliederbereich</h1>
    </div>

    <div class="container" style="max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="welcomeMsg">Lade Profil...</h3>
            <button onclick="window.logout()" style="width: auto; background: #444; color: white; padding: 5px 15px;">Abmelden</button>
        </div>

        <p style="color: var(--primary-gold); font-size: 0.9em;">Hier findest du alle aktiven Mitglieder der Super Elite Gräber:</p>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Rang</th>
                </tr>
            </thead>
            <tbody id="memberList"></tbody>
        </table>

        <div id="adminLink" style="margin-top: 20px; text-align: center; display: none;">
            <a href="admin.html" style="color: var(--primary-gold); text-decoration: none; font-size: 0.8em; border: 1px solid var(--primary-gold); padding: 5px 10px; border-radius: 4px;">🛡️ Admin Panel</a>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
