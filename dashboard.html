<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEG Austria - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="dashboard-page">

    <div class="header">
        <img src="logo.png" alt="SEG Logo" class="logo">
        <h1 style="color: var(--primary-gold); margin: 5px 0;">HAUPTQUARTIER</h1>
        <button id="adminPanelBtn" style="display: none; background: #c5a059; color: black; font-weight: bold; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            🛠 ADMIN PANEL
        </button>
    </div>

    <div class="main-content">
        
        <div class="container face-scan-container">
            <h2 style="color: var(--primary-gold); font-size: 1.2em; margin-bottom: 15px;">👤 BIOMETRISCHER CHECK-IN</h2>
            <div class="video-wrapper" style="position: relative; width: 100%; max-width: 400px; margin: 0 auto;">
                <video id="video" width="100%" height="auto" autoplay playsinline muted style="border: 2px solid var(--primary-gold); border-radius: 10px; background: #000;"></video>
                <div id="scan-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 1px solid rgba(197, 160, 89, 0.3); box-sizing: border-box;"></div>
            </div>
            <p id="faceStatus" style="margin-top: 10px; font-weight: bold; color: #aaa;">Initialisiere KI...</p>
            <button id="regBtn" onclick="window.registerFace()" style="display: none; background: #444; margin-top: 10px;">NEUES GESICHT PROFILIEREN</button>
        </div>

        <div class="dashboard-grid">
            <div class="container list-container">
                <h2 style="color: var(--primary-gold);">ANWESENHEIT</h2>
                <table>
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>ROLLE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="memberList">
                        <tr><td colspan="3" style="text-align: center;">Lade Daten...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="container log-container">
                <h2 style="color: var(--primary-gold);">AKTIVITÄT</h2>
                <div id="logList" style="max-height: 300px; overflow-y: auto;">
                    </div>
            </div>
        </div>

        <button onclick="window.logout()" style="margin-top: 30px; background: transparent; border: 1px solid var(--danger); color: var(--danger);">ABMELDEN</button>
    </div>

    <script type="module" src="app.js"></script> <script type="module" src="dashboard.js"></script>

</body>
</html>
