<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEG Austria - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <div class="header">
        <img src="logo.png" alt="SEG Logo" class="logo">
        <h1 style="color: var(--primary-gold); margin: 5px 0;">SEG - Mitglieder</h1>
        <button id="adminPanelBtn" 
        onclick="window.location.href='admin.html'" 
        style="display: none; background: #c5a059; color: black; font-weight: bold; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px;">
    🛠 ADMIN PANEL
</button>
    </div>

    <div class="main-content">
        
        <div class="dashboard-grid">
            <div class="container list-container">
                <h2 style="color: var(--primary-gold);">ANWESENHEIT</h2>
                <table>
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>ROLLE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="memberList">
                        <tr><td colspan="3" style="text-align: center;">Lade Daten...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="container log-container">
                <h2 style="color: var(--primary-gold);">AKTIVITÄT</h2>
                <div id="logList" style="max-height: 300px; overflow-y: auto;">
                    </div>
            </div>
        </div>

        <button onclick="window.logout()" style="margin-top: 30px; background: transparent; border: 1px solid var(--danger); color: var(--danger);">ABMELDEN</button>
    </div>

    <script type="module" src="app.js"></script> <script type="module" src="dashboard.js"></script>

</body>
</html>
