name: Deploy Multi-Branch Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta-testing

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Main 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages

      - name: Deploy to Beta 🧪
        if: github.ref == 'refs/heads/beta-testing'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          target-folder: beta
          branch: gh-pages
          clean: false

name: Deploy Multi-Branch Pages
on:
