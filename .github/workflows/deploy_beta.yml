name: Deploy Beta
on:
  push:
    branches:
      - beta-testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Deploy to Subfolder 🧪
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          target-folder: beta
          branch: gh-pages
          clean: false