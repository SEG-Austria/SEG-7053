name: Daily Status Reset
on:
  schedule:
    # Jeden Tag um 00:00 Uhr UTC (entspricht 01:00 Uhr in DE/AT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Erlaubt es dir, den Reset manuell zum Testen zu starten

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install firebase-admin
      - name: Run Reset Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node reset_status.js
