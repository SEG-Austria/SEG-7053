name: Daily Status Reset
on:
  schedule:
    - cron: '0 0 * * *'  # 01:00 Uhr (Winterzeit DE) für Reset
    - cron: '0 17 * * *' # 18:00 Uhr (Winterzeit DE) für Abwesend (UTC ist -1h)

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install firebase-admin
      - name: Run Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Prüfen ob es 17:00 UTC (18:00 Uhr lokal) ist
          if [ "$(date +%H)" = "17" ]; then
            node evening_status.js
          else
            node reset_status.js
          fi
