<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEG Austria - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="header">
        <img src="logo.png" alt="SEG Logo" class="logo">
        <h1 style="color: var(--primary-gold); margin: 10px 0; font-family: 'Georgia', serif; letter-spacing: 2px;">SEG AUSTRIA</h1>
    </div>

    <div class="container login-box">
        <h2 style="text-align: center; color: var(--primary-gold); margin-bottom: 25px;">Willkommen</h2>
        
        <div class="input-group">
            <label style="font-size: 0.8em; color: var(--primary-gold);">BENUTZERNAME</label>
            <input type="text" id="loginEmail" placeholder="Dein Vorname...">
        </div>

        <div class="input-group">
            <label style="font-size: 0.8em; color: var(--primary-gold);">PASSWORT</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>

        <button id="loginBtn" style="margin-top: 20px; font-size: 1.1em; letter-spacing: 1px;">ANMELDEN</button>
        
        <p id="errorMsg" style="color: var(--danger); text-align: center; margin-top: 15px; font-size: 0.9em; min-height: 1.2em;"></p>
    </div>

    <p style="margin-top: 30px; color: #555; font-size: 0.7em; letter-spacing: 2px;">© SEG 2026</p>

    <script type="module" src="login.js"></script>
</body>
</html>
