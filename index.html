<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SEG - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="https://lh3.googleusercontent.com/d/1_T07pXUoKx_Kk6X-Lq9R0_fV_S_H9_zS" class="logo">
        <h1>SEG – Super Elite Gräber</h1>
    </div>

    <div class="container">
        <h2>Anmeldung</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Passwort">
        <button onclick="window.login()">Login</button>
        <button onclick="window.register()" style="background: none; color: var(--primary-gold); margin-top: 10px;">Jetzt Registrieren</button>
        <p id="status" class="status"></p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
